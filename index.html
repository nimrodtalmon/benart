<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The tree birds — Ben Talmon</title>
  <meta name="description" content="The tree birds — drawings by Ben Talmon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23fff'/><text x='50' y='70' font-size='62' text-anchor='middle' fill='%23222' font-family='Helvetica,Arial,sans-serif' font-weight='300'>B</text></svg>">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>The tree birds</h1>
      <p class="byline">by Ben Talmon</p>
    </div>
  </header>

  <nav class="filters" id="filters" aria-label="Filter artwork"></nav>

  <main>
    <section id="gallery" class="gallery" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>New art coming soon.</p>
  </main>

  <footer>
    <p>© <span id="year"></span> Ben Talmon</p>
  </footer>

  <dialog id="lightbox" class="lightbox" aria-label="Artwork viewer">
    <button class="lb-close" aria-label="Close">×</button>
    <button class="lb-prev" aria-label="Previous">‹</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-cap"></figcaption>
    </figure>
    <button class="lb-next" aria-label="Next">›</button>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
